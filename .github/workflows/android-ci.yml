name: T1GER Android CI/CD Pipeline 🐅🚀

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package Android APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🔍 TypeScript & Linter Verification
        run: npm run lint

      - name: 🏗️ Vite Production Build
        run: npm run build
        env:
          VITE_APP_MODE: production
          VITE_FIREBASE_PROJECT_ID: t1ger-69d6a

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🔄 Capacitor Sync Android
        run: npx cap sync android

      - name: 🔑 Inject Google Services JSON (if secret present)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
          fi

      - name: 🔨 Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 📱 Build Android APK (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleRelease || true

      - name: 📤 Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: t1ger-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 📤 Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: t1ger-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
