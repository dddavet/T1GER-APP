<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T1GER iPhone Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 20%, rgba(255, 107, 0, 0.16), transparent 30%),
          radial-gradient(circle at 80% 10%, rgba(204, 255, 0, 0.1), transparent 28%),
          #050505;
        color: white;
        overflow: auto;
        padding: 24px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 430px) minmax(220px, 300px);
        gap: 28px;
        align-items: center;
        width: min(100%, 820px);
      }

      .phone {
        width: 430px;
        height: 884px;
        border-radius: 58px;
        padding: 14px;
        background: linear-gradient(145deg, #2a2a2f, #060607 40%, #1b1b20);
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        position: relative;
      }

      .screen {
        width: 100%;
        height: 100%;
        border-radius: 46px;
        overflow: hidden;
        background: #050505;
        border: 1px solid rgba(255, 255, 255, 0.08);
        position: relative;
      }

      .island {
        position: absolute;
        z-index: 2;
        top: 22px;
        left: 50%;
        width: 126px;
        height: 36px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #000;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        pointer-events: none;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #050505;
      }

      .panel {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 24px;
        padding: 20px;
        backdrop-filter: blur(18px);
      }

      .panel h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1;
        text-transform: uppercase;
        font-style: italic;
      }

      .panel p {
        margin: 0 0 16px;
        color: #a1a1aa;
        font-size: 13px;
        line-height: 1.5;
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      button,
      a {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        color: white;
        border-radius: 14px;
        padding: 12px 14px;
        font-weight: 900;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
      }

      button.primary {
        background: #ccff00;
        color: #050505;
        border-color: #ccff00;
      }

      @media (max-width: 820px) {
        body {
          padding: 0;
          place-items: start center;
        }

        .workspace {
          display: block;
          width: 100%;
        }

        .phone {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          padding: 0;
        }

        .screen {
          border-radius: 0;
          border: 0;
        }

        .island,
        .panel {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="workspace">
      <section class="phone" aria-label="iPhone preview frame">
        <div class="screen">
          <div class="island"></div>
          <iframe id="preview" src="/?iphonePreview=1" title="T1GER running at iPhone dimensions"></iframe>
        </div>
      </section>

      <aside class="panel">
        <h1>iPhone Preview</h1>
        <p>
          This is a Windows-friendly iPhone-sized preview. It is not Apple's iOS Simulator, but it keeps T1GER constrained to a real mobile viewport while we build.
        </p>
        <div class="actions">
          <button class="primary" onclick="document.getElementById('preview').contentWindow.location.reload()">Reload app</button>
          <button onclick="document.getElementById('preview').src='/?iphonePreview=1&forceOnboarding=1'">Open onboarding</button>
          <a href="/" target="_blank" rel="noreferrer">Open full localhost</a>
        </div>
      </aside>
    </main>
  </body>
</html>
